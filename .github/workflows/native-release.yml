name: Native release

permissions:
  contents: write
  id-token: write
  attestations: write

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - native/VERSION

concurrency:
  group: native-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Update package database
        run: pacman -Syu --noconfirm

      - name: Install dependencies
        run: >-
          pacman -S --noconfirm --needed
          git cmake ninja extra-cmake-modules
          qt6-base qt6-webengine qt6-svg qt6-imageformats layer-shell-qt
          kglobalaccel kwindowsystem kpackage kconfig
          opencv tesseract tesseract-data-eng tesseract-data-rus
          nodejs npm curl file patchelf appstream github-cli

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Validate release version
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < native/VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-native\.[0-9]+$ ]]; then
            echo "Invalid native/VERSION: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Verify tag is new
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; bump native/VERSION first." >&2
            exit 1
          fi

      - name: Verify source and metadata
        run: |
          python scripts/check-upstream-contract.py --require-complete
          appstreamcli validate --no-net native/resources/awakened-poe-trade-native.appdata.xml

      - name: Build renderer and native host
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          UPDATE_REPOSITORY: ${{ github.repository }}
        run: ./build-native.sh

      - name: Run native tests
        run: ctest --test-dir native/build --output-on-failure

      - name: Download AppImage packaging tools
        run: |
          # Pin asset IDs as well as hashes: continuous-tag assets are replaced.
          # Update each ID and digest together from the official release metadata.
          curl -fL --retry 3 -H 'Accept: application/octet-stream' -o linuxdeploy-x86_64.AppImage https://api.github.com/repos/linuxdeploy/linuxdeploy/releases/assets/699514588
          curl -fL --retry 3 -H 'Accept: application/octet-stream' -o linuxdeploy-plugin-qt-x86_64.AppImage https://api.github.com/repos/linuxdeploy/linuxdeploy-plugin-qt/releases/assets/525032210
          curl -fL --retry 3 -H 'Accept: application/octet-stream' -o runtime-x86_64 https://api.github.com/repos/AppImage/type2-runtime/releases/assets/657374641
          echo "df908b19f1ed1cdafa79508d415aa12d6c56ce4d56d4149aa8c09286718706e5  linuxdeploy-x86_64.AppImage" | sha256sum -c -
          echo "cfc1055b2b9dbc08412b579f20990b7b41a17b61beaa5847dc9477c96c9e9617  linuxdeploy-plugin-qt-x86_64.AppImage" | sha256sum -c -
          echo "617aa77314d57c8b8e4fae9c3f0b35af7b30d5529cb69e98f64f92510ed98a46  runtime-x86_64" | sha256sum -c -
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Package AppImage
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          SKIP_BUILD: 1
          APPIMAGE_EXTRACT_AND_RUN: 1
          LINUXDEPLOY: ${{ github.workspace }}/linuxdeploy-x86_64.AppImage
          QT_PLUGIN: ${{ github.workspace }}/linuxdeploy-plugin-qt-x86_64.AppImage
          APPIMAGE_RUNTIME: ${{ github.workspace }}/runtime-x86_64
        run: ./package-appimage.sh

      - name: Verify release artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          artifact="$GITHUB_WORKSPACE/native/build/Awakened-PoE-Trade-Native-$VERSION-x86_64.AppImage"
          sha256sum -c "$artifact.sha256"
          output="$(APPIMAGE_EXTRACT_AND_RUN=1 "$artifact" --version)"
          [[ "$output" == *"$VERSION"* ]]
          extract_dir="$(mktemp -d)"
          (
            cd "$extract_dir"
            "$artifact" --appimage-extract >/dev/null
            test -f squashfs-root/usr/plugins/wayland-graphics-integration-client/libqt-plugin-wayland-egl.so
            test -f squashfs-root/usr/share/kwin/scripts/awakened-poe-trade-native-focus/metadata.json
            test -f squashfs-root/usr/share/kwin/scripts/awakened-poe-trade-native-focus/contents/code/main.js
          )

      - name: Generate SPDX SBOM
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          artifact="native/build/Awakened-PoE-Trade-Native-$VERSION-x86_64.AppImage"
          python scripts/generate-spdx-sbom.py \
            --root native/build/AwakenedPoETrade.AppDir \
            --artifact "$artifact" \
            --version "$VERSION" \
            --output "native/build/Awakened-PoE-Trade-Native-$VERSION-x86_64.spdx.json"

      - name: Attest AppImage provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: native/build/Awakened-PoE-Trade-Native-${{ steps.version.outputs.version }}-x86_64.AppImage

      - name: Attest AppImage SBOM
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-path: native/build/Awakened-PoE-Trade-Native-${{ steps.version.outputs.version }}-x86_64.AppImage
          sbom-path: native/build/Awakened-PoE-Trade-Native-${{ steps.version.outputs.version }}-x86_64.spdx.json

      - name: Publish GitHub release and tag
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Awakened PoE Trade Native ${{ steps.version.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: |
            native/build/Awakened-PoE-Trade-Native-*.AppImage
            native/build/Awakened-PoE-Trade-Native-*.AppImage.sha256
            native/build/Awakened-PoE-Trade-Native-*.spdx.json
